roleRules:
  primary_definition:
    source: first ID-like table column occurrence outside traceability matrices
    evidenceRoles: [primary_definition]
    authority: trace-evidence-only
  supplemental_definition:
    source: later ID-like table column occurrence for an already primary label outside traceability matrices
    evidenceRoles: [supplemental_definition]
    policy: supports repeated-risk or restated source-authority rows without duplicate-primary failure
  coverage_reference:
    source: relationship, validation, evidence, dependency, milestone, control, review, release, and traceability matrix cells
    evidenceRoles: [coverage_reference]
    policy: never creates primary authority
  mention:
    source: prose or table text without definition or coverage-column signals
    evidenceRoles: [mention]
  table_evidence_candidate:
    source: table-only typed ctx://trace links from compatibility fixtures
    evidenceRoles: [table_evidence_candidate]
    policy: non-authoritative unless future R2 design approves promotion
relationshipRules:
  column_derived_coverage:
    source: normalized non-matrix table column names with a "_coverage" suffix
    policy: provisional semantic hint for the column's coverage intent; creates trace evidence only
  traceability_matrix_coverage:
    source: traceability matrix cells
    policy: matrix row creates coverage edges only, never definitions
  coverage_range:
    source: same-family range text in coverage columns or matrix cells
    policy: creates range evidence only after endpoint resolution checks
