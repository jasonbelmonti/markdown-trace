rangeRules:
  syntax: "<FAMILY>-<n> through <FAMILY>-<m>"
  validEndpointPolicy: both endpoints should resolve to primary or supplemental definitions in the same document family
  unresolvedEndpointPolicy: unresolved endpoints remain diagnostic candidates and do not create authoritative edges
  observedValidExamples: [PKG-1 through PKG-9, WP-1 through WP-6, MS-1 through MS-4, VAL-1 through VAL-14]
  observedGapExamples: [EVD-1 through EVD-14]
matrixSemantics:
  tableSignal: section title contains "Traceability Matrix"
  rowKind: matrix_coverage_row
  rowSourcePolicy: first-column labels can source coverage edges
  cellPolicy: all matrix cells are coverage_reference or coverage_range
  forbiddenRoles: [primary_definition, supplemental_definition]
repeatedIdPolicy:
  single_primary_with_references: one primary plus coverage or mention uses is valid
  primary_with_supplemental_definition: one primary plus later ID-column restatement is valid supplemental evidence
  coverage_or_reference_only: repeated coverage references do not define an entity
  non_authoritative_table_candidate: table-only typed ctx://trace labels remain candidates
  duplicate_primary_candidate: more than one primary_definition is a diagnostic candidate
diagnosticClasses:
  unresolved_reference: r0.extractor.unresolved_raw_id_candidate
  duplicate_primary: r0.extractor.repeated_id.duplicate_primary_candidate
  supplemental_definition_notice: r0.extractor.repeated_id.primary_with_supplemental_definition
  unresolved_range_endpoint: r0.extractor.unresolved_raw_range_endpoint_candidate
  missing_matrix_coverage: r0.graph.missing_matrix_coverage_candidate
profileShapeRecommendation:
  preferred: standalone-graph-profile
  rationale: relationship, range, matrix, and duplicate-role semantics are semantic trace-evidence claims, not markdown-engine structural validation rules
  deferredAlternatives: [authoring-profile-extension, markdown-engine-validation-profile-extension]
